plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
}

ext {
    minecraft_version = "26.2"
    loader_version = "0.20.1"
    fabric_version = "0.161.0+26.2"
    yacl_version = "3.9.7+26.2-fabric"
    modmenu_version = "20.0.3"
    mod_version = "1.1.1"
}

base {
    archivesName = "strayarmor-${minecraft_version}"
}

sourceSets {
    main {
        java {
            srcDir rootProject.file("shared/java")
            srcDir rootProject.file("shared/modern/java")
        }
        resources {
            srcDir rootProject.file("shared/resources")
        }
    }
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.isxander.dev/releases" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation "dev.isxander:yet-another-config-lib:${yacl_version}"
    implementation "com.terraformersmc:modmenu:${modmenu_version}"
}

processResources {
    inputs.property "version", mod_version
    inputs.property "minecraft_version", minecraft_version
    inputs.property "loader_version", loader_version
    filesMatching("fabric.mod.json") {
        expand(
                "version": mod_version,
                "minecraft_version": minecraft_version,
                "loader_version": loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
